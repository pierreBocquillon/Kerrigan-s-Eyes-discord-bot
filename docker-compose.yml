services:
  bot:
    build: .
    container_name: kerrigan-eyes-bot
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      - PORT=${PORT:-3000}
    # le port reçoit aussi les webhooks de Kerrigan's Eyes (POST /webhooks/ke)
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    # permet de joindre Kerrigan's Eyes lancé sur la même machine : KE_URL=http://host.docker.internal:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:$${PORT}/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
